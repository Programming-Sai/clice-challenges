name: Build and Push Challenge Images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fresh_build:
        description: "Ignore build cache for all 14 challenges on BOTH architectures"
        type: boolean
        required: false
        default: false

# Serialize publication; a superseded run must not publish an older registry.
concurrency:
  group: clice-challenge-publication
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      challenges: ${{ steps.find.outputs.challenges }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Validate the 14 canonical challenge images
        id: find
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import yaml

          expected = {
              "awk-sales-aggregate", "cron-suppress", "dns-forward-zone",
              "failed-login-audit", "firewall-port-8080", "ghost-service",
              "grep-hyphen", "hello-clice", "mysql-grant-select",
              "nginx-static-8080", "perm-numeric-764", "sed-heredoc-norm",
              "timeout-test", "user-custom-home",
          }
          folders = {p.parent.name for p in Path('.').glob('*/Dockerfile')}
          if folders != expected:
              raise SystemExit(f"Unexpected challenge set: missing={expected-folders}, extra={folders-expected}")
          metadata_folders = {p.parent.name for p in Path('.').glob('*/challenge.yaml')}
          if metadata_folders != expected:
              raise SystemExit("Metadata folders and the 14 image folders must match")
          for code in sorted(expected):
              config = yaml.safe_load(Path(code, 'challenge.yaml').read_text(encoding='utf-8-sig'))
              image = f"ghcr.io/programming-sai/clice-challenges/{code}:latest"
              if config.get('code') != code or config.get('image') != image:
                  raise SystemExit(f"{code}: expected matching code and image {image}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('challenges=' + json.dumps(sorted(expected)) + '\n')
          PY
      - name: Check checker shell syntax
        run: |
          for checker in */check.sh; do
            bash -n "$checker"
          done

  build:
    name: Build and smoke-test ${{ matrix.challenge }} (${{ matrix.target.arch }})
    needs: discover
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        challenge: ${{ fromJson(needs.discover.outputs.challenges) }}
        target:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/programming-sai/clice-challenges/${{ matrix.challenge }}
      ARCH: ${{ matrix.target.arch }}
      CHALLENGE: ${{ matrix.challenge }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm native runner and Docker engine architecture
        shell: bash
        run: |
          set -euo pipefail
          normalize_arch() {
            case "$1" in
              x86_64|amd64) printf 'amd64' ;;
              aarch64|arm64) printf 'arm64' ;;
              *) printf '%s' "$1" ;;
            esac
          }
          test "$(normalize_arch "$(uname -m)")" = "$ARCH"
          test "$(normalize_arch "$(docker info --format '{{.Architecture}}')")" = "$ARCH"
          echo "Native host and Docker engine confirmed: $ARCH"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push platform image by digest (not latest)
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.challenge }}
          platforms: linux/${{ matrix.target.arch }}
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh_build }}
          # Separate caches prevent the two architectures overwriting each other.
          cache-from: type=gha,scope=${{ matrix.challenge }}-${{ matrix.target.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.challenge }}-${{ matrix.target.arch }},ignore-error=true
          labels: |
            org.opencontainers.image.source=https://github.com/Programming-Sai/clice-challenges
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=ghcr.io/programming-sai/clice-challenges/${{ matrix.challenge }},push-by-digest=true,name-canonical=true,push=true
      - name: Native container smoke test
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          ref="$IMAGE@$DIGEST"
          docker pull --platform "linux/$ARCH" "$ref"
          actual=$(docker image inspect --format '{{.Architecture}}' "$ref")
          test "$actual" = "$ARCH"

          # Use Clice's keep-alive pattern. No QEMU and no host mounts.
          cid=""
          cleanup() {
            if [ -n "$cid" ]; then docker rm -f "$cid" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT
          cid=$(docker run --detach --platform "linux/$ARCH" \
            --network none --memory 512m --cpus 1 \
            "$ref" tail -f /dev/null)
          docker exec "$cid" /bin/bash -c \
            'set -e; test -d /workspace; for tool in bash tail cat chmod stat; do command -v "$tool" >/dev/null || exit 1; done; printf "native shell ready\n"'
          docker cp "$CHALLENGE/check.sh" "$cid:/tmp/clice-check.sh"
          docker exec "$cid" /bin/bash -n /tmp/clice-check.sh

          # Exercise a real checker on both architectures. This is not a
          # full Clice app/TUI integration test or coverage of all checkers.
          if [ "$CHALLENGE" = hello-clice ]; then
            docker exec "$cid" /bin/bash -c 'rm -f /workspace/output.txt'
            set +e
            docker exec "$cid" /bin/bash /tmp/clice-check.sh
            result=$?
            set -e
            test "$result" -eq 1
            docker exec "$cid" /bin/bash -c 'printf "Hello clice\n" > /workspace/output.txt'
            docker exec "$cid" /bin/bash /tmp/clice-check.sh
            echo "hello-clice rejected missing work and accepted correct work on $ARCH"
          fi
      - name: Save tested image digest
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$CHALLENGE-$ARCH.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.challenge }}-${{ matrix.target.arch }}
          path: digests/*.txt
          if-no-files-found: error
          retention-days: 7

  merge:
    name: Assemble multi-platform ${{ matrix.challenge }}
    needs: [discover, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        challenge: ${{ fromJson(needs.discover.outputs.challenges) }}
    env:
      IMAGE: ghcr.io/programming-sai/clice-challenges/${{ matrix.challenge }}
      CHALLENGE: ${{ matrix.challenge }}
      STAGING_TAG: candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.challenge }}-*
          path: digests
          merge-multiple: true
      - name: Assemble candidate index from this run's tested digests
        shell: bash
        run: |
          set -euo pipefail
          amd64=$(cat "digests/$CHALLENGE-amd64.txt")
          arm64=$(cat "digests/$CHALLENGE-arm64.txt")
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create \
            --tag "$IMAGE:$STAGING_TAG" \
            "$IMAGE@$amd64" "$IMAGE@$arm64"
      - name: Require both runnable platforms (attestations do not count)
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$STAGING_TAG" --raw > index.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path('index.json').read_text())
          actual = {
              (m.get('platform', {}).get('os'), m.get('platform', {}).get('architecture'))
              for m in index.get('manifests', [])
          }
          required = {('linux', 'amd64'), ('linux', 'arm64')}
          if not required.issubset(actual):
              raise SystemExit(f'Missing runnable platforms: {required - actual}')
          print('Confirmed linux/amd64 AND linux/arm64')
          PY

  promote:
    name: Promote all validated multi-platform tags
    needs: [discover, merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      CHALLENGES: ${{ needs.discover.outputs.challenges }}
      STAGING_TAG: candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Update latest and source-commit tags only after every candidate passes
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r challenge; do
            image="ghcr.io/programming-sai/clice-challenges/$challenge"
            docker buildx imagetools create \
              --tag "$image:latest" \
              --tag "$image:$SOURCE_SHA" \
              "$image:$STAGING_TAG"
            docker buildx imagetools inspect "$image:latest" --raw > index.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path('index.json').read_text())
          actual = {
              (m.get('platform', {}).get('os'), m.get('platform', {}).get('architecture'))
              for m in index.get('manifests', [])
          }
          if not {('linux', 'amd64'), ('linux', 'arm64')}.issubset(actual):
              raise SystemExit('Published tag is missing a runnable platform')
          PY
          done < <(printf '%s' "$CHALLENGES" | jq -r '.[]')

  publish-registry:
    name: Publish registry after multi-platform promotion
    needs: [discover, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Generate and validate registry
        run: |
          python registry.py
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('registry.json').read_text())
          expected = {p.parent.name for p in Path('.').glob('*/Dockerfile')}
          entries = registry['challenges']
          if registry['total'] != 14 or len(entries) != 14 or {c['code'] for c in entries} != expected:
              raise SystemExit('Refusing to publish an incomplete registry')
          for c in entries:
              if c['image'] != f"ghcr.io/programming-sai/clice-challenges/{c['code']}:latest":
                  raise SystemExit(f"Non-canonical image for {c['code']}")
          PY
          mkdir -p deploy
          cp registry.json registry.hash deploy/
      - name: Deploy registry
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: registry
          keep_files: false
