name: Build and Push Challenge Images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fresh_build:
        description: "Ignore build cache for a clean rebuild of all 14 images"
        type: boolean
        required: false
        default: false

# Serialize publication; a superseded run must not publish an older registry.
concurrency:
  group: clice-challenge-publication
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      challenges: ${{ steps.find.outputs.challenges }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Validate the 14 canonical challenge images
        id: find
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import yaml

          expected = {
              "awk-sales-aggregate", "cron-suppress", "dns-forward-zone",
              "failed-login-audit", "firewall-port-8080", "ghost-service",
              "grep-hyphen", "hello-clice", "mysql-grant-select",
              "nginx-static-8080", "perm-numeric-764", "sed-heredoc-norm",
              "timeout-test", "user-custom-home",
          }
          folders = {p.parent.name for p in Path('.').glob('*/Dockerfile')}
          if folders != expected:
              raise SystemExit(f"Unexpected challenge set: missing={expected-folders}, extra={folders-expected}")
          metadata_folders = {p.parent.name for p in Path('.').glob('*/challenge.yaml')}
          if metadata_folders != expected:
              raise SystemExit("Metadata folders and the 14 image folders must match")
          for code in sorted(expected):
              config = yaml.safe_load(Path(code, 'challenge.yaml').read_text(encoding='utf-8-sig'))
              image = f"ghcr.io/programming-sai/clice-challenges/{code}:latest"
              if config.get('code') != code or config.get('image') != image:
                  raise SystemExit(f"{code}: expected matching code and image {image}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('challenges=' + json.dumps(sorted(expected)) + '\n')
          PY
      - name: Check checker shell syntax
        run: |
          for checker in */check.sh; do
            bash -n "$checker"
          done

  build:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        challenge: ${{ fromJson(needs.discover.outputs.challenges) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.challenge }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.challenge }}
          # This reset retains the current amd64 target. ARM is a separate
          # follow-up, after checking multi-arch support for each base image.
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh_build }}
          # One cache scope per challenge avoids matrix jobs overwriting it.
          cache-from: type=gha,scope=${{ matrix.challenge }}
          cache-to: type=gha,mode=max,scope=${{ matrix.challenge }},ignore-error=true
          labels: |
            org.opencontainers.image.source=https://github.com/Programming-Sai/clice-challenges
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/programming-sai/clice-challenges/${{ matrix.challenge }}:latest
            ghcr.io/programming-sai/clice-challenges/${{ matrix.challenge }}:${{ github.sha }}

  publish-registry:
    name: Publish registry after all 14 image builds succeed
    needs: [discover, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Generate and validate registry
        run: |
          python registry.py
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('registry.json').read_text())
          expected = {p.parent.name for p in Path('.').glob('*/Dockerfile')}
          entries = registry['challenges']
          if registry['total'] != 14 or len(entries) != 14 or {c['code'] for c in entries} != expected:
              raise SystemExit('Refusing to publish an incomplete registry')
          for c in entries:
              if c['image'] != f"ghcr.io/programming-sai/clice-challenges/{c['code']}:latest":
                  raise SystemExit(f"Non-canonical image for {c['code']}")
          PY
          mkdir -p deploy
          cp registry.json registry.hash deploy/
      - name: Deploy registry
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: registry
          keep_files: false
